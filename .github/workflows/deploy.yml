name: CI and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CI intentionally uses the latest pnpm instead of the
      # version pinned in package.json.
      - name: Remove conflicting package-manager pin
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (pkg.packageManager) {
            console.log(`Removing CI-only package manager pin: ${pkg.packageManager}`);
            delete pkg.packageManager;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          } else {
            console.log('No package manager pin found.');
          }
          NODE

      - name: Install latest pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          install: false

      - name: Install latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Production build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build -- --base="${PAGES_BASE_PATH}/"

      - name: Verify production artifact
        shell: bash
        run: |
          test -s dist/index.html
          echo "Production artifact verified."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: quality

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
